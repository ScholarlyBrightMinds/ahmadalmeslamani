<style>
    /* ── home-specific: research pillars as one connected panel ── */
    .home-pillars {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--border-s);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        margin-top: 0.4rem;
    }
    .hp-card {
        background: var(--card);
        padding: 1.6rem 1.5rem 1.5rem;
        position: relative;
        transition: background-color .2s var(--ease);
    }
    .hp-card::before {
        content: '';
        position: absolute;
        left: 0; top: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), transparent 70%);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform .3s var(--ease);
    }
    .hp-card:hover { background: var(--card-soft); }
    .hp-card:hover::before { transform: scaleX(1); }
    .hp-icon {
        width: 36px; height: 36px;
        border-radius: var(--radius-s);
        background: var(--accent-bg);
        border: 1px solid var(--accent-glow);
        display: grid;
        place-items: center;
        color: var(--accent);
        margin-bottom: 1rem;
    }
    .hp-icon svg { width: 18px; height: 18px; }
    .hp-title {
        font-family: var(--display);
        font-size: 1.02rem;
        font-weight: 600;
        letter-spacing: -0.015em;
        margin-bottom: 0.4rem;
        color: var(--text);
    }
    .hp-desc {
        font-size: 0.83rem;
        color: var(--text-soft);
        line-height: 1.6;
    }
    @media (max-width: 760px) {
        .home-pillars { grid-template-columns: 1fr; }
    }
</style>
</head>
